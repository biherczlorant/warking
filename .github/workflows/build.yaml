name: Build, Check, and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

env:
  IDF_TARGET: esp32c3
  IDF_VERSION: v6.0.1
  PROJECT_NAME: warking

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: esp-idf build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: ${{ env.IDF_TARGET }}
          path: '.'

      - name: Verify build artifacts exist
        run: |
          test -f build/${{ env.PROJECT_NAME }}.elf || (echo "ELF not found!" && exit 1)
          idf_size_out=$(du -h build/${{ env.PROJECT_NAME }}.elf | cut -f1)
          echo "Built ELF size: $idf_size_out"

      - name: Rename ELF with version/commit tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          cp build/${{ env.PROJECT_NAME }}.elf build/${{ env.PROJECT_NAME }}-${SHORT_SHA}.elf

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-firmware
          path: |
            build/${{ env.PROJECT_NAME }}.elf
            build/${{ env.PROJECT_NAME }}.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/${{ env.PROJECT_NAME }}.elf
            build/${{ env.PROJECT_NAME }}.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

